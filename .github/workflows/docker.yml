name: docker

# Pipeline structure borrowed from NookMux's docker-image.yml, adapted to this
# repo — four stages:
#   prepare           compute the image name, the channel tag (latest / branch /
#                     git tag) and an immutable YYYYMMDD-<sha7> rollback tag,
#                     plus the per-arch build matrix
#   bundle            build dist/server.cjs ONCE (arch-independent: the bundle
#                     is pure JS and supermarkdown ships every platform binary)
#                     and hand it to the arch jobs via artifact
#   build-single-arch one runner per arch, pushing per-arch tags
#                     (<tag>-amd64 / <tag>-arm64); public repos get a free
#                     native arm64 runner (ubuntu-24.04-arm) — no QEMU emulation
#                     unless the DOCKER_ARM64_QEMU_FALLBACK repo variable is set
#   create-manifests  merge the per-arch images into the final multi-arch
#                     manifest (imagetools create), then cosign keyless-sign it
#
# Publishing stays push-triggered: latest tracks the default branch, v* tags
# publish under their own tag name. PRs only validate the build and push
# nothing. All actions are pinned to release SHAs.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # a newer publish on the same ref supersedes an in-flight one
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tags_json: ${{ steps.vars.outputs.tags_json }}
      matrix_json: ${{ steps.vars.outputs.matrix_json }}
    steps:
      - name: Compute image, tags and build matrix
        id: vars
        env:
          DOCKER_ARM64_QEMU_FALLBACK: ${{ vars.DOCKER_ARM64_QEMU_FALLBACK }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}"
          immutable="$(date -u +'%Y%m%d')-${GITHUB_SHA::7}"

          ref="${GITHUB_REF}"
          case "$ref" in
            refs/tags/*)                       channel="${GITHUB_REF_NAME,,}" ;;
            refs/heads/main|refs/heads/master) channel="latest" ;;
            refs/heads/*)                      channel="${GITHUB_REF_NAME,,}" ;;
            *)                                 channel="" ;;  # PR: validate only
          esac

          if [ -n "$channel" ]; then
            tags_json=$(jq -nc --arg channel "$channel" --arg immutable "$immutable" \
              '[$channel, $immutable]')
          else
            # PRs push nothing, but the build step still wants at least one tag
            tags_json='["pr-validation"]'
          fi

          # arm64 builds on a free native runner for public repos; private
          # repos fall back to QEMU via the DOCKER_ARM64_QEMU_FALLBACK variable
          if [ "${DOCKER_ARM64_QEMU_FALLBACK:-}" = "true" ]; then
            arm64_runner="ubuntu-latest"
            arm64_qemu=true
          else
            arm64_runner="ubuntu-24.04-arm"
            arm64_qemu=false
          fi

          matrix_json=$(jq -nc --arg arm64_runner "$arm64_runner" --argjson arm64_qemu "$arm64_qemu" \
            '{
              include: [
                {arch: "amd64", platform: "linux/amd64", runner: "ubuntu-latest", qemu: false},
                {arch: "arm64", platform: "linux/arm64", runner: $arm64_runner, qemu: $arm64_qemu}
              ]
            }')

          {
            echo "image=$image"
            echo "tags_json=$tags_json"
            echo "matrix_json=$matrix_json"
          } >> "$GITHUB_OUTPUT"

  bundle:
    name: Build bundle (arch-independent)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install root deps (esbuild)
        run: npm ci --no-audit --no-fund

      # installs vendor deps, applies patches/, bundles dist/server.cjs with
      # the commit stamped in as the version
      - name: Bundle server (deps + patches + esbuild)
        env:
          BYOK_VERSION: ${{ github.sha }}
        run: node scripts/bootstrap.mjs

      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            dist/server.cjs
            vendor/CCursor/Cursor++/node_modules/@vakra-dev/supermarkdown
          retention-days: 1
          if-no-files-found: error

  build-single-arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare, bundle]
    strategy:
      # one arch failing doesn't cancel the other; the manifest job below
      # still requires both, so a tag is never silently downgraded to one arch
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix_json) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundle artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: artifact

      # minimal context for Dockerfile.ci: prebuilt server.cjs + supermarkdown
      - name: Assemble build context
        run: |
          mkdir -p .ci-context/node_modules/@vakra-dev
          cp artifact/dist/server.cjs .ci-context/server.cjs
          cp -r "artifact/vendor/CCursor/Cursor++/node_modules/@vakra-dev/supermarkdown" \
            .ci-context/node_modules/

      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare per-arch tags
        id: tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "tags<<ARCH_TAGS_EOF"
            jq -r --arg image "$IMAGE" --arg suffix "-$ARCH" \
              '.[] | "\($image):\(.)\($suffix)"' <<< "$TAGS_JSON"
            echo "ARCH_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .ci-context
          file: Dockerfile.ci
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # provenance + SBOM attestations ride along on the per-arch images and
          # survive the manifest merge below
          provenance: mode=max
          sbom: true

  create-manifests:
    name: Create manifests & sign
    needs: [prepare, build-single-arch]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        id: manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create \
              -t "$IMAGE:$tag" \
              "$IMAGE:$tag-amd64" \
              "$IMAGE:$tag-arm64"
          done < <(jq -r '.[]' <<< "$TAGS_JSON")

          # every tag points at the same manifest; one digest is enough to sign
          first="$(jq -r '.[0]' <<< "$TAGS_JSON")"
          digest="$(docker buildx imagetools inspect "$IMAGE:$first" --format '{{json .Manifest.Digest}}' | jq -r .)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the multi-arch manifest (keyless)
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Job summary
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS_JSON: ${{ needs.prepare.outputs.tags_json }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo '```'
            jq -r --arg image "$IMAGE" '.[] | "\($image):\(.)"' <<< "$TAGS_JSON"
            echo '```'
            echo "digest: \`$DIGEST\` (cosign keyless-signed)"
          } >> "$GITHUB_STEP_SUMMARY"
